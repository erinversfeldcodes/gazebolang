schema_version = 0

[components.domain]
pack = "rust"
root = "."
paths = ["crates/domain/**"]
test = ["cargo", "nextest", "run", "-p", "domain"]

[components.importer]
pack = "rust"
root = "."
paths = ["crates/importer/**"]

[components.web]
pack = "rust"
root = "."
paths = ["crates/web/**", "editor/**", "migrations/**"]

# The end-to-end specs are tests, and are reviewed as tests: whether each would fail if
# the behaviour it guards broke, and how it waits.
[components.e2e]
pack = "test-truth"
root = "."
paths = ["e2e/**"]

[components.platform]
root = "."
paths = ["AGENTS.md", ".github/**", "Dockerfile", "docker-compose.yml", "flake.nix", "flake.lock", "justfile", "fly*.toml", "garage.toml", "deny.toml", "scripts/**"]

[gates.format]
run = ["just", "fmt-check"]
when_paths = ["crates/**"]
timeout_seconds = 300

[gates.lint]
run = ["just", "lint"]
when_paths = ["crates/**", "Cargo.toml", "Cargo.lock"]
timeout_seconds = 3600

[gates.test]
run = ["just", "test"]
when_paths = ["crates/**", "migrations/**", "Cargo.toml", "Cargo.lock"]
timeout_seconds = 3600
# CI's `test` job runs this same command with a Postgres service and the Pixabay
# key, so a workspace that cannot may leave the gate to it.
ci_check = "test"

[gates.test.requires]
DATABASE_URL = "env"
PIXABAY_API_KEY = "secret"

# Assumes the app is already running: heph does not start services. Start it
# first, as README.md describes for running the end-to-end specs locally
# (`just db-up`, `just storage-init`, `just db-migrate`, `cargo leptos build`,
# `cargo build -p importer`, then run the built server so it listens on
# BASE_URL), and install the specs' dependencies once with
# `cd e2e && npm ci && npx playwright install --with-deps chromium`.
[gates.e2e]
run = ["npm", "--prefix", "e2e", "test"]
when_paths = ["e2e/**", "crates/web/**"]
timeout_seconds = 3600
# CI's `E2E (local)` job runs the same specs against a local instance it starts.
ci_check = "E2E (local)"

[gates.e2e.requires]
BASE_URL = "env"
DATABASE_URL = "env"
