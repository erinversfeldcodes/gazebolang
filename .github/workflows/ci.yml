name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      # importer vendors and CMake-builds llama.cpp from source (see
      # crates/importer's own Cargo.toml) — can't confirm cmake ships
      # preinstalled on this runner image, so install it explicitly rather
      # than find out the hard way.
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo fmt --all -- --check
      # web's ssr and hydrate halves are mutually exclusive features that
      # each only compile for one target (native vs wasm32), so each needs
      # its own pass.
      - run: cargo clippy --workspace --all-targets --features web/ssr -- -W clippy::pedantic -D warnings
      - run: cargo clippy -p web --no-default-features --features hydrate --target wasm32-unknown-unknown --lib -- -W clippy::pedantic -D warnings
      - run: cargo clippy -p importer --all-targets -- -W clippy::pedantic -D warnings

  # Exercises the `metal` feature path (see crates/importer/Cargo.toml's
  # comment on how it gets pulled in on macOS/aarch64) — the `check` job
  # above only builds/lints importer on Linux, which never compiles that
  # path at all.
  importer-macos:
    name: importer (macOS/Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p importer
      - run: cargo test -p importer

  test:
    name: test
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # sqlx::test needs CREATEDB privilege to spin up a fresh database per
      # test; the default role from the postgres image already has it.
      DATABASE_URL: postgres://app:app@localhost:5432/app
      # image_search::tests::real_providers_all_respond_to_a_search hits
      # the real Pixabay API and fails loudly (not a skip) if the key is
      # missing or Pixabay doesn't respond — see that test's own doc
      # comment for why this is deliberate.
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --features web/ssr

  # Runs the real Playwright suite against a fully local, ephemeral instance
  # of the app (own Postgres service, no Resend configured — email falls
  # back to Console mode, same graceful degradation local dev already
  # relies on). Storage is real, though: Garage (the same image
  # docker-compose.yml uses for local dev) started and bootstrapped here the
  # same way `just storage-init` does locally, so image/audio/video upload
  # e2e coverage exercises the actual upload path rather than the
  # no-storage-configured no-op. Deliberately NOT run against production:
  # cards/decks are a single shared, unscoped pool with no per-tenant
  # isolation, so e2e-created fixtures would show up in the real four users'
  # review queues. Preview apps (see preview.yml) separately get e2e run
  # against the real deployed artifact, each on its own Neon branch.
  e2e:
    name: E2E (local)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      BASE_URL: http://127.0.0.1:3000
      # Matches the fixed dev key/bucket `just storage-init` creates — see
      # .env.example for what each of these means.
      S3_BUCKET: gazebo-cards
      S3_ENDPOINT: http://localhost:3900
      S3_ACCESS_KEY: gazebo-local-dev-key
      S3_SECRET_KEY: gazebo-local-dev-secret-access-key-0000000000000000
      S3_PUBLIC_URL: http://gazebo-cards.web.garage.localhost:3902
      S3_PATH_STYLE: "true"
      S3_REGION: garage
      # image-search.spec.ts's two real-provider tests need this to reach
      # Pixabay for real — see that file's own comment on why it's not
      # mocked.
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      # env_logger (see main.rs's env_logger::init()) prints nothing at
      # all without this — the app's own log::warn! on a failed provider
      # request (see image_search.rs's search) would otherwise vanish
      # silently, leaving a real connectivity failure indistinguishable
      # from a search that legitimately found nothing.
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli,cargo-leptos,just
      # importer vendors and CMake-builds llama.cpp from source — see the
      # same comment on the `check` job above.
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      # wiki-editor.js/.css are gitignored build output (see .gitignore's
      # comment on them) — built here the same way the Dockerfile's
      # editor-builder stage does for a real deploy. Without this,
      # window.mountWikiEditor never exists and every wiki e2e test times
      # out waiting for .wiki-editor-toolbar, since cargo-leptos has
      # nothing in crates/web/public to copy into the site root.
      - name: Build wiki editor island
        working-directory: editor
        run: |
          npm ci
          npm run build
      # Only the garage service, not the whole compose stack — Postgres
      # here is the `services:` container above (port 5432), not
      # docker-compose.yml's (port 55432, for local dev only).
      - name: Start Garage (S3-compatible storage)
        run: docker compose up -d garage
      - name: Bootstrap Garage bucket/key
        run: just storage-init
      - run: sqlx migrate run --source migrations
      - run: cargo leptos build
      # Built here (not in a separate job) so it lands in this job's own
      # target/debug/ for e2e/tests/import-dictionary.spec.ts to exec
      # directly — that test only exercises the `create` stage, which
      # needs no model/GPU, so a plain debug build is enough.
      - run: cargo build -p importer
      # importer's app_client.rs hand-mirrors leptos's server-fn wire
      # paths as hardcoded constants (see that file's own comment on
      # why) — these are generated, not written by hand, and nothing
      # stops them drifting from what a real build actually produces.
      # Catch that here, with a clear fix-it message, rather than let
      # it surface downstream as a cryptic 404 in the e2e run below.
      - name: Verify importer's hardcoded server-fn paths match this build
        run: |
          set -euo pipefail
          actual=$(strings target/site/pkg/web.wasm | grep -o '/api/[a-zA-Z_]*[0-9]\{10,\}' | sort -u)
          expected=$(grep -oE '"/api/[a-zA-Z_]*[0-9]+"' crates/importer/src/app_client.rs | tr -d '"' | sort -u)
          if [ "$actual" != "$expected" ]; then
            echo "::error::importer's hardcoded server-fn paths in app_client.rs no longer match this build's real wasm output."
            echo "Hardcoded in crates/importer/src/app_client.rs:"
            echo "$expected"
            echo "Actually produced by this build (target/site/pkg/web.wasm):"
            echo "$actual"
            echo "Update LOG_IN_PATH / SAVE_WORD_DEFINITION_PATH in crates/importer/src/app_client.rs to the values above."
            exit 1
          fi
          echo "importer's hardcoded server-fn paths match this build."
      - name: Start the app in the background
        # Redirected to a file so the server's own logs (RUST_LOG above)
        # are actually retrievable afterwards — see the artifact upload
        # step below — rather than mixed into this step's own transient
        # output.
        run: ./target/debug/web > web-server.log 2>&1 &
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install E2E deps and Playwright browsers
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for local server to be ready
        run: |
          for _ in $(seq 1 20); do
            if curl -sf --max-time 5 "${BASE_URL}/health" >/dev/null 2>&1; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::local server never became ready"
          exit 1
      - name: Run E2E suite
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright traces (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-ci
          path: |
            e2e/test-results/
            web-server.log
          retention-days: 14
