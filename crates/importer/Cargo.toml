[package]
name = "importer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "importer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
indicatif = "0.18.6"
llama-cpp-2 = { version = "0.1.161", features = ["mtmd", "common"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "rustls", "form", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting"] }

[dev-dependencies]
proptest = "1.12.0"
